name: Deploy to GitHub Pages
on:
  push:
    branches: [master]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm install
      - run: npm run build
      - uses: actions/deploy-pages@v2
      - uses: actions/upload-pages-artifact@v1
        with:
          path: dist
permissions:
  pages: write
  id-token: write